# Marky local dev environment (ADR 0005, 0015).
# Seedha `docker compose` mat chalao; `./dev ...` use karo, kyunki wo versions.env + .env dono load karta hai
# aur HOST_UID/HOST_GID set karta hai.

name: marky

# ---- Infra tunables (non-secret), ek jagah named (CLAUDE.md section 4) ----
# Healthcheck: container "ready" hai ya nahi, kitni der me aur kitni baar check karein.
x-dev-tunables:
  healthcheck-timing: &healthcheck-timing
    interval: 2s        # har check ke beech ka gap
    timeout: 3s         # ek check kitni der tak wait kare
    retries: 15         # itni baar fail ho tab "unhealthy"
    start_period: 5s    # shuru ke itne time ke failures count nahi hote

# DB connection URLs, .env ke values se bante hain (password do jagah likhna na pade).
# Host "postgres" = Docker network me service ka naam; 5432 = container ke andar Postgres ka fixed port.
# Do tarah ke users (ADR 0018):
#   admin (POSTGRES_USER) -> migrations, bootstrap, test seeding. Superuser hai, RLS bypass karta hai.
#   marky_app             -> app runtime. Role ka naam migration me define hai (platform/db/migrations).
x-admin-database-url: &admin-database-url "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable"
x-app-database-url: &app-database-url "postgres://marky_app:${APP_DB_PASSWORD:?.env missing APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable"
x-test-admin-database-url: &test-admin-database-url "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${TEST_POSTGRES_DB:?.env missing TEST_POSTGRES_DB}?sslmode=disable"
x-test-app-database-url: &test-app-database-url "postgres://marky_app:${APP_DB_PASSWORD:?}@postgres:5432/${TEST_POSTGRES_DB:?}?sslmode=disable"

services:
  dev:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
      args:
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG:?versions.env missing}
        PNPM_VERSION: ${PNPM_VERSION:?versions.env missing}
    image: marky-dev:${NODE_IMAGE_TAG:?}-pnpm${PNPM_VERSION:?}
    user: "${HOST_UID:?run via ./dev}:${HOST_GID:?run via ./dev}"
    init: true                       # signals (Ctrl+C) sahi se child processes tak pahunchein
    command: ["sleep", "infinity"]   # long-running; commands `exec` se chalti hain (ADR 0015)
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      APP_ENV: ${APP_ENV:?.env missing APP_ENV (dekho .env.example)}
      DATABASE_URL: *app-database-url             # app runtime: hamesha marky_app (RLS lagta hai)
      MIGRATION_DATABASE_URL: *admin-database-url # sirf dev tooling (Kysely type codegen)
      TEST_DATABASE_URL: *test-app-database-url
      TEST_ADMIN_DATABASE_URL: *test-admin-database-url
      VALKEY_URL: "redis://valkey:6379"   # Valkey Redis protocol bolta hai, isliye scheme redis://
      PORT: ${WEB_PORT:?}
    ports:
      - "127.0.0.1:${WEB_PORT:?}:${WEB_PORT:?}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:?versions.env missing}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env missing}
      POSTGRES_DB: ${POSTGRES_DB:?.env missing}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}   # sirf `./dev db bootstrap` ke liye (marky_app ka password set karna)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    volumes:
      # Postgres 18+ images ka data /var/lib/postgresql/<major>/ ke andar hota hai, isliye mount parent folder par.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:?versions.env missing}
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:?}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "valkey-cli", "ping"]

  # One-off tool: `./dev db ...` chalata hai, ye hamesha chalu nahi rehta (profile "tools").
  dbmate:
    image: amacneil/dbmate:${DBMATE_VERSION:?versions.env missing}
    profiles: ["tools"]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: *admin-database-url
      TEST_DATABASE_URL: *test-admin-database-url   # `./dev test` isse test DB migrate karta hai (dbmate --env)
      DBMATE_MIGRATIONS_DIR: /workspace/platform/db/migrations
      DBMATE_SCHEMA_FILE: /workspace/platform/db/schema.sql   # har migration ke baad schema dump (ADR 0020)
      DBMATE_WAIT: "true"             # DB ready hone tak ruko
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  valkey-data:
